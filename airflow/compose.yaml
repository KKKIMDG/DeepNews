name: deepnews-airflow
services:
  airflow:
    build: .
    command: standalone
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: ../backend/.env
        required: false
      - path: ../.env
        required: false
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      PYTHONPATH: /opt/deepnews
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ../backend:/opt/deepnews/backend:ro
      # 빅카인즈에서 내려받은 엑셀을 airflow/inbox/에 넣는다. 처리 후 processed/·failed/로 옮겨지므로 쓰기 가능해야 한다.
      - ./inbox:/opt/deepnews/inbox
volumes:
  airflow-home:
