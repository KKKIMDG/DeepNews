name: deepnews-airflow
services:
  airflow:
    build: .
    command: standalone
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: ../backend/.env
        required: false
      - path: ../.env
        required: false
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      DEEPNEWS_QUERY: "AI"
      DEEPNEWS_LIMIT: "5"
      PYTHONPATH: /opt/deepnews
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ../backend:/opt/deepnews/backend:ro
      - news-output:/opt/deepnews/output
volumes:
  airflow-home:
  news-output:
