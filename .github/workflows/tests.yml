name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # Unit tests never load the models, so the torch stack is skipped to keep CI fast.
      - name: Install dependencies (without torch/transformers)
        run: |
          grep -vE '^(torch|transformers|tokenizers|safetensors)==' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"
      - name: Unit tests
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: python -m unittest discover -s tests -v
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit --no-deps -r requirements.txt

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for package.json
        id: pkg
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.present == 'true'
        with:
          node-version: 20
      - name: Article extraction test
        if: steps.pkg.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          node tests/test_article_extraction.cjs
