<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepNews Recommender</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="hero">
        <div class="hero-top">
          <div>
            <p class="eyebrow">DeepNews</p>
            <h1>뉴스 추천 데모</h1>
          </div>
          <label class="theme-toggle" for="theme-toggle">
            <input id="theme-toggle" type="checkbox" />
            <span>다크모드</span>
          </label>
        </div>
        <p class="subcopy">네이버 뉴스 페이지를 열면 MIND SVD 협업 필터링 기반 추천 기사를 보여줍니다.</p>
      </header>

      <section class="card">
        <h2>추천 신호</h2>
        <div id="keyword-list" class="keyword-list"></div>
      </section>

      <section class="card">
        <h2>신호 가중치</h2>
        <div id="keyword-chart" class="chart"></div>
      </section>

      <section class="card">
        <h2>추천 방식</h2>
        <p id="summary" class="summary">네이버 뉴스 페이지에서 추천 결과를 불러옵니다.</p>
      </section>

      <section class="card">
        <h2>추천 네이버 기사</h2>
        <ul id="recommendations" class="recommendations"></ul>
      </section>

      <section class="card">
        <h2>상태</h2>
        <p id="ad-likelihood" class="ad-likelihood"></p>
      </section>
    </main>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
